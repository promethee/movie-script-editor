<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Movie Script Editor</title>
    <style>
        body { margin: 0; font-family: sans-serif; overflow: hidden; display: flex; flex-direction: column; height: 100vh; }
        #menu-bar { background: #f0f0f0; border-bottom: 1px solid #ccc; display: flex; padding: 2px 5px; font-size: 13px; user-select: none; }
        .menu-item { padding: 4px 10px; cursor: default; position: relative; }
        .menu-item:hover { background: #e0e0e0; }
        .dropdown { display: none; position: absolute; top: 100%; left: 0; background: white; border: 1px solid #ccc; box-shadow: 2px 2px 5px rgba(0,0,0,0.2); z-index: 100; min-width: 150px; }
        .menu-item.active .dropdown { display: block; }
        .dropdown-item { padding: 6px 12px; cursor: pointer; }
        .dropdown-item:hover { background: #0078d7; color: white; }
        #editor { flex: 1; width: 100%; border: none; padding: 20px; box-sizing: border-box; font-family: 'Courier New', Courier, monospace; font-size: 16px; outline: none; resize: none; }
    </style>
</head>
<body>
    <div id="menu-bar">
        <div class="menu-item">File
            <div class="dropdown">
                <div class="dropdown-item" id="new-file">New</div>
                <div class="dropdown-item" id="open-file">Open</div>
                <div class="dropdown-item" id="save-file">Save</div>
                <div class="dropdown-item" id="save-as-file">Save As...</div>
            </div>
        </div>
        <div class="menu-item">Edit
            <div class="dropdown">
                <div class="dropdown-item" id="undo">Undo</div>
                <div class="dropdown-item" id="redo">Redo</div>
            </div>
        </div>
    </div>
    <textarea id="editor" placeholder="Start writing your script..."></textarea>

    <script>
        const editor = document.getElementById('editor');
        let currentFilePath = null;

        // Menu handling logic
        document.querySelectorAll('.menu-item').forEach(item => {
            item.addEventListener('click', (e) => {
                // Toggle current menu
                const wasActive = item.classList.contains('active');
                document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));
                if (!wasActive) item.classList.add('active');
                e.stopPropagation();
            });
        });

        window.addEventListener('click', () => {
            document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));
        });

        async function handleNew() {
            if (currentFilePath && editor.value.length > 0) {
                if (!confirm('Unsaved changes will be lost. Continue?')) return;
            }
            editor.value = '';
            currentFilePath = null;
            document.title = 'New Script - Movie Script Editor';
        }

        async function handleOpen() {
            const filePath = await window.electronAPI.openFile();
            if (filePath) {
                const content = await window.electronAPI.readFile(filePath);
                if (content.error) {
                    alert('Error reading file: ' + content.error);
                    return;
                }
                editor.value = content;
                currentFilePath = filePath;
                document.title = `${pathName(filePath)} - Movie Script Editor`;
            }
        }

        async function handleSave() {
            if (!currentFilePath) {
                return handleSaveAs();
            }
            const result = await window.electronAPI.writeFile({ filePath: currentFilePath, content: editor.value });
            if (result && result.error) {
                alert('Error saving file: ' + result.error);
            }
        }

        async function handleSaveAs() {
            const filePath = await window.electronAPI.saveFileAs();
            if (filePath) {
                const result = await window.electronAPI.writeFile({ filePath: filePath, content: editor.value });
                if (result.error) {
                    alert('Error saving file: ' + result.error);
                    return;
                }
                currentFilePath = filePath;
                document.title = `${pathName(filePath)} - Movie Script Editor`;
            }
        }

        function pathName(path) {
            return path.split(/[\\/]/).pop();
        }

        // Keyboard Shortcuts
        window.addEventListener('keydown', (e) => {
            if (e.ctrlKey) {
                switch (e.key.toLowerCase()) {
                    case 's':
                        e.preventDefault();
                        handleSave();
                        break;
                    case 'n':
                        e.preventDefault();
                        handleNew();
                        break;
                    case 'o':
                        e.preventDefault();
                        handleOpen();
                        break;
                    case 'z':
                        if (e.shiftKey) {
                            e.preventDefault();
                            document.execCommand('redo');
                        } else {
                            e.preventDefault();
                            document.execCommand('undo');
                        }
                        break;
                }
            }
        });

        document.getElementById('new-file').addEventListener('click', handleNew);
        document.getElementById('open-file').addEventListener('click', handleOpen);
        document.getElementById('save-file').addEventListener('click', handleSave);
        document.getElementById('save-as-file').addEventListener('click', handleSaveAs);

        // Basic Undo/Redo using native textarea behavior
        document.getElementById('undo').addEventListener('click', () => document.execCommand('undo'));
        document.getElementById('redo').addEventListener('click', () => document.execCommand('redo'));
    </script>
</body>
</html>
